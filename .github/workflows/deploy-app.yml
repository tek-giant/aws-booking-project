name: Build and deploy booking application
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, staging, production]
        default: development
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-${{ inputs.environment || 'development' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'development' }}
    env:
      CLUSTER: three-tier-${{ inputs.environment || 'development' }}
      SERVICE: three-tier-${{ inputs.environment || 'development' }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --load -t booking-ci:local ./app
      - name: Test the built image
        run: |
          docker run --rm --entrypoint python \
            -v "$GITHUB_WORKSPACE/app/test_app.py:/app/test_app.py:ro" \
            booking-ci:local -m unittest -v test_app.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload image to ECR
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          IMAGE_URI="$REGISTRY/$SERVICE:$IMAGE_TAG"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag booking-ci:local "$IMAGE_URI"
          docker push --platform linux/amd64 "$IMAGE_URI"
          DIGEST=$(aws ecr describe-images --repository-name "$SERVICE" --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$DIGEST" == sha256:* ]] || { echo 'ECR did not return an image digest'; exit 1; }
          echo "IMAGE=$REGISTRY/$SERVICE@$DIGEST" >> "$GITHUB_ENV"
          echo "Uploaded $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Register and deploy a new task revision
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$CURRENT" --query taskDefinition > current.json
          jq --arg image "$IMAGE" '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            | (.containerDefinitions[] | select(.name == "app") | .image) = $image
          ' current.json > next.json
          NEXT=$(aws ecs register-task-definition --cli-input-json file://next.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEXT" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          ACTUAL=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          test "$ACTUAL" = "$NEXT" || { echo 'Deployment rolled back'; exit 1; }
